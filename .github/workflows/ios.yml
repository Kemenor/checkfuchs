name: iOS · TestFlight

# Build the iOS app, upload it to TestFlight, and — on a version tag (v*) —
# submit it straight for App Store review, which auto-releases on approval.
# **The tag IS the human gate** (same model as knabberfuchs): cutting a tag is
# already a deliberate act, so there is no second approval step. A plain
# workflow_dispatch stops at TestFlight; ios-release.yml remains the manual
# way to (re)submit an existing TestFlight build on its own.
# Free on GitHub-hosted macOS runners because this repo is public.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID                    App Store Connect API key id      — account-level, same as knabberfuchs
#   ASC_ISSUER_ID                 App Store Connect issuer id       — account-level, same as knabberfuchs
#   ASC_API_KEY_P8_BASE64         base64 of AuthKey_<id>.p8         — ProtonDrive *.base64
#   IOS_DIST_CERT_P12_BASE64      base64 of the Apple Distribution .p12       — TODO (export on Mac)
#   IOS_DIST_CERT_PASSWORD        password set when exporting that .p12       — TODO
#   IOS_PROVISION_PROFILE_BASE64  base64 of the App Store .mobileprovision    — TODO (Checkfuchs-specific profile)
#   KEYCHAIN_PASSWORD             any random string for the temp keychain     — TODO
#
# The TODO secrets come from the first signed build on the Mac: create the
# App Store Connect app record (bundle id ch.fuchsnest.checkfuchs), let Xcode
# automatic signing create the distribution cert + provisioning profile;
# export them, `base64` them, and paste here. This workflow also needs
# ios/ExportOptions.plist, generated during that same Mac step (method =
# app-store, manual signing, the App Store provisioning profile). Until those
# exist it will fail at the signing/build step — that is expected.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Same gate as ci.yml (analyze + test): a v* tag on a red or never-tested
  # commit must not reach TestFlight. Runs on Linux — cheaper than macOS.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  testflight:
    needs: test
    # macOS 26 image → Xcode 26 (iOS 26 SDK), as pinned for knabberfuchs;
    # macos-latest may still point at macOS 15 during the migration.
    runs-on: macos-26
    # The beta lane blocks until Apple finishes processing the build, so the
    # job outlives the upload itself — give processing room.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify tag matches pubspec version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PUBSPEC=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          if [ "${TAG#v}" != "${PUBSPEC%%+*}" ]; then
            echo "::error::Tag $TAG does not match pubspec.yaml version: $PUBSPEC — bump pubspec (and the four changelogs) before tagging."
            exit 1
          fi

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Install App Store Connect API key (.p8)
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p fastlane
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "fastlane/AuthKey_${ASC_KEY_ID}.p8"

      - name: Import signing certificate & provisioning profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT="$RUNNER_TEMP/dist.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$CERT"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Build signed IPA
        # ios/ExportOptions.plist is created during Mac setup (first signed
        # build): method=app-store, teamID, manual signing, the App Store
        # provisioning profile for ch.fuchsnest.checkfuchs.
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Pin fastlane
        # The macOS runner image ships whatever fastlane is newest; pin the
        # version verified for knabberfuchs so TestFlight uploads stay reproducible.
        run: sudo gem install fastlane --no-document -v 2.236.1

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_FILEPATH: fastlane/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: fastlane ios beta

  # Tag pushes only: submit the build that `testflight` just uploaded for App
  # Store review (auto-releases on approval). Same fastlane `release` lane
  # ios-release.yml drives, so there is one submission path, not two — pure
  # App Store Connect API work, hence Linux. The version/build pair is read
  # from pubspec.yaml, which the tag-vs-pubspec check above already proved
  # matches the tag.
  release:
    needs: testflight
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read version and build number from pubspec
        id: ver
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=${V%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${V##*+}" >> "$GITHUB_OUTPUT"
          echo "Submitting ${V%%+*} (${V##*+}) for App Store review"

      - name: Install App Store Connect API key (.p8)
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p fastlane
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "fastlane/AuthKey_${ASC_KEY_ID}.p8"

      - name: Install fastlane
        # Pinned to the verified version, same as ios-release.yml.
        run: sudo gem install fastlane --no-document -v 2.236.1

      - name: Submit for review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_FILEPATH: fastlane/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          # Inputs via env, not inline interpolation (injection-safe).
          REL_VERSION: ${{ steps.ver.outputs.version }}
          REL_BUILD: ${{ steps.ver.outputs.build }}
        run: fastlane ios release version:"$REL_VERSION" build:"$REL_BUILD"
