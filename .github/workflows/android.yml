name: Android · Play

# Build the signed Android App Bundle on a version tag (v*) and release it on
# the "alpha" closed-testing track AND production in a single edit — the
# Android counterpart to ios.yml (which ships the build to TestFlight and then
# submits it for App Store review). Same model as knabberfuchs:
# **the tag IS the human gate** — cutting a tag is already a deliberate act,
# so a tagged release goes fully live with no second approval. The protected
# `play-production` environment hold applies only to the manual production
# dispatch below, which has no tag behind it.
# A manual workflow_dispatch stages on a single chosen track instead — with
# promote_version_code set it skips the build and assigns that
# ALREADY-UPLOADED build to the track (Play rejects re-uploading a
# versionCode, so a closed→production cutover of the same build must promote,
# not rebuild). Reuses the local release tooling: the upload keystore for
# signing + tool/play_upload_aab.py (service account) for the upload, exactly
# as documented in CLAUDE.md.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64      base64 of the upload keystore (.jks)        — from the BACKED-UP keystore (ProtonDrive)
#   ANDROID_KEY_ALIAS            key alias inside the keystore               — from local android/key.properties
#   ANDROID_KEY_PASSWORD         password for that key                       — from local android/key.properties
#   ANDROID_STORE_PASSWORD       password for the keystore                   — from local android/key.properties
#   PLAY_STORE_KEY_JSON_BASE64   base64 of fastlane/play-store-key.json      — the Play service-account key (HAVE)
#
# Make a base64 secret with:  base64 -w0 <file>   (macOS: base64 -i <file>)
# Without these the build still runs but falls back to the DEBUG signing key
# (android/app/build.gradle.kts: no key.properties → debug config), which
# Play rejects on upload — so all five are mandatory for the upload to land.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Play track(s) to stage the release on, space-separated (manual run only). Every build goes to internal + closed testing by default."
        default: "internal alpha"
        type: string
      promote_version_code:
        description: "Promote this already-uploaded versionCode to the track instead of building (e.g. 12)"
        default: ""
        type: string

jobs:
  # Same gate as ci.yml (analyze + test): a v* tag on a red or never-tested
  # commit must not reach the Play tracks.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  play:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # A manual dispatch to the production track is a full public rollout
    # (status: completed) with no tag behind it — bind it to the protected
    # `play-production` environment, whose required-reviewer rule holds the
    # job until approved in the GitHub UI. Tag pushes run unguarded even
    # though they reach production too: the tag is the human gate.
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.track == 'production' && 'play-production' || '' }}
    # Serialize Play uploads: concurrent runs would race independent edits
    # against the same app. Queue, never cancel, a release in flight.
    concurrency:
      group: play-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify tag matches pubspec version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PUBSPEC=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          if [ "${TAG#v}" != "${PUBSPEC%%+*}" ]; then
            echo "::error::Tag $TAG does not match pubspec.yaml version: $PUBSPEC — bump pubspec (and the four changelogs) before tagging."
            exit 1
          fi

      # Promote runs (promote_version_code set) skip everything build-related:
      # no Java/Flutter/keystore/AAB — only the service-account key install
      # and the track assignment below.
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        if: github.event.inputs.promote_version_code == ''
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: github.event.inputs.promote_version_code == ''
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Flutter pub get
        if: github.event.inputs.promote_version_code == ''
        run: flutter pub get

      - name: Generate localizations
        if: github.event.inputs.promote_version_code == ''
        run: flutter gen-l10n

      - name: Install signing keystore & key.properties
        if: github.event.inputs.promote_version_code == ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty — release would sign with the debug key and Play would reject it."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          # build.gradle.kts reads storeFile via file(...) — an absolute path
          # resolves as-is. Keys: storeFile / storePassword / keyAlias / keyPassword.
          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Install Play service-account key
        env:
          PLAY_STORE_KEY_JSON_BASE64: ${{ secrets.PLAY_STORE_KEY_JSON_BASE64 }}
        run: |
          if [ -z "$PLAY_STORE_KEY_JSON_BASE64" ]; then
            echo "::error::PLAY_STORE_KEY_JSON_BASE64 is empty — the upload would fail with an auth traceback only after the ~10-minute build."
            exit 1
          fi
          mkdir -p fastlane
          echo "$PLAY_STORE_KEY_JSON_BASE64" | base64 --decode > fastlane/play-store-key.json

      - name: Build release App Bundle
        if: github.event.inputs.promote_version_code == ''
        run: flutter build appbundle --release

      - name: Upload to Play
        env:
          DISPATCH_TRACK: ${{ github.event.inputs.track }}
          PROMOTE_VC: ${{ github.event.inputs.promote_version_code }}
        run: |
          python3 -m pip install --quiet google-api-python-client google-auth
          if [ -n "$PROMOTE_VC" ]; then
            # Manual promote: assign the existing build to the chosen track.
            # shellcheck disable=SC2086  # the input is a track list
            python3 tool/play_upload_aab.py --promote "$PROMOTE_VC" $DISPATCH_TRACK
          elif [ -n "$DISPATCH_TRACK" ]; then
            # Manual run: stage on the chosen track only.
            # shellcheck disable=SC2086  # the input is a track list
            python3 tool/play_upload_aab.py $DISPATCH_TRACK
          else
            # Tag push (v*): one upload, released on the closed-testing track
            # AND production — the tag is the gate.
            python3 tool/play_upload_aab.py "internal" "alpha" "production"
          fi
