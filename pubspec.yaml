name: checkfuchs
description: "Combined habit & to-do app — one surface, local-first."
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  intl: ^0.20.2

  # Shared design system (theme, triad palette, Figtree, status colours).
  fuchsbau:
    git:
      url: https://github.com/Kemenor/fuchsbau.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
