name: checkfuchs
description: "Combined habit & to-do app — one surface, local-first."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.0.0
  intl: ^0.20.2

  # Local-first persistence.
  drift: ^2.34.0
  drift_flutter: ^0.3.0

  # Shared design system (theme, triad palette, Figtree, status colours).
  # Pinned to a tag: a `ref: main` pin can die in an upstream history rewrite
  # (an orphaned resolved-ref broke CI once); tags are stable fetch targets.
  fuchsbau:
    git:
      url: https://github.com/Kemenor/fuchsbau.git
      ref: v0.3.0

  # Reminders (Phase 5): discrete local notifications, tz-correct scheduling.
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  package_info_plus: ^10.2.0
  share_plus: ^13.2.0
  archive: ^4.0.9
  file_selector: ^1.1.0
  workmanager: ^0.9.0+3
  material_symbols_icons: ^4.2951.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4

# App icon (Checkfuchs). Regenerate with: dart run flutter_launcher_icons
# Same recipe as knabberfuchs: full art for legacy/iOS, transparent fox as the
# adaptive foreground on the family emerald. No monochrome layer on purpose —
# a colour bitmap used as one collapses into a silhouette under themed icons.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/checkfuchs.png"
  adaptive_icon_background: "#1FA85D"
  adaptive_icon_foreground: "assets/icon/checkfuchs_fg.png"
  min_sdk_android: 26

flutter:
  uses-material-design: true
  generate: true
