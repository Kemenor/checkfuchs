name: checkfuchs
description: "Combined habit & to-do app — one surface, local-first."
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.0.0
  intl: ^0.20.2

  # Local-first persistence.
  drift: ^2.34.0
  drift_flutter: ^0.3.0

  # Shared design system (theme, triad palette, Figtree, status colours).
  fuchsbau:
    git:
      url: https://github.com/Kemenor/fuchsbau.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  generate: true
